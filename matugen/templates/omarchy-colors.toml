# AUTO-GENERATED by matugen from the current wallpaper - do not hand-edit.
# Source template: dotfiles/matugen/templates/omarchy-colors.toml
#
# Consumed by Omarchy's omarchy-theme-set-templates, which feeds every themed
# surface (the v4 Quickshell bar/menus/lock, hyprland borders, and the frozen
# curated app configs the `dynamic` theme ships).
#
# WHY TWO SCHEMAS: Omarchy 4 replaced the ANSI `colorN` palette with semantic
# keys. Its resolver (omarchy-theme-color) still accepts `colorN` via a legacy
# alias cascade, and canonical semantic names take precedence when both are
# present. Omarchy 3.8.x only understands the legacy block and ignores unknown
# keys outright. Emitting both makes one template correct on either side of the
# quattro upgrade, so a wallpaper change never has to be sequenced against it.
# The legacy block can be deleted once 3.8.x is gone for good.
#
# Material You (scheme-tonal-spot, dark) role ordering this mapping relies on:
#   container_lowest < surface < container_low < container < container_high
# so the background ramp below is guaranteed monotonic for any wallpaper.

mode = "dark"

# --- Foundations ----------------------------------------------------------
accent    = "{{colors.primary.default.hex}}"
selection  = "{{colors.primary_container.default.hex}}"
muted      = "{{colors.outline_variant.default.hex}}"

# Background ramp, darkest to lightest. `lighter_background` is the elevated
# surface (bar capsules, hovered rows, cards) - under the old legacy-only
# template v4 would have aliased it from color0 (= container_lowest) and drawn
# "elevated" chrome DARKER than the window behind it.
darker_background  = "{{colors.surface.default.hex | set_lightness: 2}}"
dark_background    = "{{colors.surface_container_lowest.default.hex}}"
background         = "{{colors.surface.default.hex}}"
lighter_background = "{{colors.surface_container_high.default.hex}}"

# Foreground ramp, dimmest to brightest. Mirrors the relative spacing of the
# stock themes (cf. tokyo-night): dark < base < light < bright.
dark_foreground   = "{{colors.outline.default.hex}}"
foreground        = "{{colors.on_surface.default.hex}}"
light_foreground  = "{{colors.on_surface.default.hex | set_lightness: 94}}"
bright_foreground = "{{colors.on_surface.default.hex | set_lightness: 97}}"

# --- Hues -----------------------------------------------------------------
# Material You yields three harmonized hues (primary/secondary/tertiary) plus
# error; ANSI wants six. The duplication below is deliberate and harmless under
# core-shell scope: terminals and editors stay curated (frozen in the theme
# dir), so the only hue the live shell actually reads is `red` - alerts,
# recording indicators, polkit failures, and the lock-screen error state.
red     = "{{colors.error.default.hex}}"
green   = "{{colors.tertiary.default.hex}}"
yellow  = "{{colors.secondary.default.hex}}"
blue    = "{{colors.primary.default.hex}}"
magenta = "{{colors.tertiary.default.hex}}"
cyan    = "{{colors.secondary.default.hex}}"
orange  = "{{colors.primary.default.hex}}"

# Intentionally omitted, left to Omarchy's documented derivation so they stay
# consistent with how stock themes resolve:
#   bright_*  = mix(<hue>, white, 20%)
#   brown     = mix(orange, black, 50%)
#   cursor    = bright_foreground   (forced by the resolver; not settable here)

# --- Legacy ANSI block (Omarchy 3.8.x only; ignored by v4's canonical keys) --
cursor               = "{{colors.on_surface.default.hex | set_lightness: 97}}"
selection_foreground = "{{colors.on_primary.default.hex}}"
selection_background = "{{colors.primary.default.hex}}"

color0  = "{{colors.surface_container_lowest.default.hex}}"
color1  = "{{colors.error.default.hex}}"
color2  = "{{colors.tertiary.default.hex}}"
color3  = "{{colors.secondary.default.hex}}"
color4  = "{{colors.primary.default.hex}}"
color5  = "{{colors.tertiary.default.hex}}"
color6  = "{{colors.secondary.default.hex}}"
color7  = "{{colors.on_surface_variant.default.hex}}"
color8  = "{{colors.outline.default.hex}}"
color9  = "{{colors.error.default.hex}}"
color10 = "{{colors.tertiary.default.hex}}"
color11 = "{{colors.secondary.default.hex}}"
color12 = "{{colors.primary.default.hex}}"
color13 = "{{colors.tertiary.default.hex}}"
color14 = "{{colors.secondary.default.hex}}"
color15 = "{{colors.on_surface.default.hex}}"
