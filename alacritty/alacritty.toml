general.import = [ "~/.config/omarchy/current/theme/alacritty.toml" ]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "Maple Mono NF CN" }
bold = { family = "Maple Mono NF CN" }
italic = { family = "Maple Mono NF CN" }
size = 10

[window]
padding.x = 8
padding.y = 8
decorations = "None"

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
# Ctrl+V pastes. Wispr Flow injects transcribed text by copying it to the
# clipboard and sending Ctrl+V (the GUI paste combo). Terminals normally
# ignore Ctrl+V, so this binding lets dictation land in the terminal.
# (Tradeoff: overrides readline's Ctrl+V "quoted-insert"; use Ctrl+Shift+V-free
# paths if you need verbatim key entry.)
{ key = "V", mods = "Control", action = "Paste" },
# Ctrl+Alt+V sends a raw Ctrl+V byte (0x16) THROUGH to the running app instead of
# Alacritty pasting. This lets Claude Code (and other TUIs) receive Ctrl+V for
# their own paste — e.g. pasting an image from the clipboard — since plain Ctrl+V
# above is consumed by Alacritty for Wispr dictation. So: Ctrl+V = paste text
# (dictation), Ctrl+Alt+V = app-level paste (Claude Code image paste).
{ key = "V", mods = "Control|Alt", chars = "\u0016" },
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
{ key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
# Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
{ key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" },
# Alt+Backspace sends ESC+DEL so readline's backward-kill-word deletes a whole word.
{ key = "Back", mods = "Alt", chars = "\u001B\u007F" },
# Super+Backspace sends Ctrl+U (unix-line-discard) to clear the line, like macOS Cmd+Backspace.
{ key = "Back", mods = "Super", chars = "\u0015" }
]
