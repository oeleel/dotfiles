general.import = [ "~/.local/state/omarchy/current/theme/alacritty.toml" ]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "Maple Mono NF CN" }
bold = { family = "Maple Mono NF CN" }
italic = { family = "Maple Mono NF CN" }
size = 10

[window]
padding.x = 8
padding.y = 8
decorations = "None"

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
# Ctrl+V sends a raw Ctrl+V byte (0x16) THROUGH to the running app instead of
# Alacritty pasting, so Claude Code receives Ctrl+V for its own clipboard paste
# (images AND text - verified: Claude Code inserts clipboard text on 0x16, so
# Wispr dictation still lands in Claude Code through this path).
# Tradeoff: dictation no longer auto-lands at a PLAIN shell prompt / vim, since
# Wispr's injected Ctrl+V becomes readline quoted-insert there. The dictated
# text is already on the clipboard - press Ctrl+Alt+V to paste it.
{ key = "V", mods = "Control", chars = "\u0016" },
# Ctrl+Alt+V = terminal-level paste (clipboard text). Manual fallback for
# dictating into non-Claude contexts, and for plain text paste generally.
{ key = "V", mods = "Control|Alt", action = "Paste" },
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
{ key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
# Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
{ key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" },
# Alt+Backspace sends ESC+DEL so readline's backward-kill-word deletes a whole word.
{ key = "Back", mods = "Alt", chars = "\u001B\u007F" },
# Super+Backspace sends Ctrl+U (unix-line-discard) to clear the line, like macOS Cmd+Backspace.
{ key = "Back", mods = "Super", chars = "\u0015" }
]
