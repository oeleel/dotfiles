# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    # Tighter gaps than stock (was 5/10)
    gaps_in = 3
    gaps_out = 6

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    # Gentle rounding: soft but still minimal
    rounding = 8

    # Stronger frost so the subtle translucency actually reads as glass
    blur {
        enabled = true
        size = 4
        passes = 3
    }
}

# Slightly more translucent windows than stock so the blur shows through
# (overrides the default-opacity tag from Omarchy defaults: was 0.985/0.96)
windowrule = opacity 0.92 0.88, match:tag default-opacity

# Terminals go noticeably glassier — text stays readable over the blur
windowrule = opacity 0.84 0.78, match:class ^(Alacritty|dropdown-terminal)$

# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    # macOS-feel motion: fast start, gentle landing (easeOutExpo), short durations
    bezier = easeOutExpo, 0.16, 1, 0.3, 1

    animation = windows, 1, 3.8, easeOutExpo
    animation = windowsIn, 1, 4, easeOutExpo, popin 90%
    animation = windowsOut, 1, 1.8, linear, popin 92%
    animation = border, 1, 5, easeOutExpo

    # Stock Omarchy disables workspace animations; give them a quick slide
    animation = workspaces, 1, 4.5, easeOutExpo, slide
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # See only one column per screen instead of two
    # column_width = 0.97
}
