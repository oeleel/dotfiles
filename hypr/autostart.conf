# Extra autostart processes
# exec-once = uwsm-app -- my-service
exec-once = omarchy-lock-screen

# Re-apply Breeze cursor on every Hyprland start (setcursor is runtime-only)
exec-once = hyprctl setcursor breeze_cursors 24

# Pyprland daemon: powers the dropdown scratchpad (see ~/.config/pypr/config.toml)
exec-once = pypr

# Keep the Wispr Flow flow bar pinned to bottom-center (see script header).
# Starts before Wispr itself so the event listener is already up when the bar maps.
exec-once = ~/.config/hypr/wispr-flow-position.sh

# Wispr Flow (voice dictation) — headless. No window is shown: the Hub window is
# sent straight to the hidden `special:wispr` workspace by a windowrule in
# hyprland.conf (verified against the compositor event stream — Hub's title is set
# before it maps, so the rule matches on first eval and it never flashes onto the
# active workspace). SUPER+U pulls it into view. Push-to-talk is Caps Lock, which
# keyd rewrites to F13; it's handled by wispr-flow-linux-helper globally, so
# dictation works with no window visible.
#
# Launched here rather than via Wispr's own "open at login": that preference is
# set, but Electron implements it by writing ~/.config/autostart/*.desktop and
# that file has never existed, so it was silently a no-op. Doing it here also
# keeps the setting in dotfiles instead of inside Wispr's config.json, which the
# app rewrites on exit. Wispr holds a single-instance lock, so if its own
# autostart ever starts working the duplicate just exits.
exec-once = uwsm-app -- wispr-flow

# Noctalia — the bar (replaces Waybar; Waybar autostart is disabled via the
# omarchy `waybar-off` toggle flag). Omarchy's own autostart never launches
# Noctalia, so it must be started here.
exec-once = uwsm-app -- noctalia

# hyprshell — Windows-style ALT+TAB with live window thumbnails. Runs as a daemon
# and registers its own ALT+TAB bind over Hyprland IPC (bindings.conf only unbinds
# Omarchy's cyclenext so it can't fire underneath). Hold ALT, Tab / Shift+Tab to
# move, release ALT to commit.
#
# HYPRSHELL_EXPERIMENTAL=1 is REQUIRED: without it the thumbnails silently fall
# back to plain app icons. Previews use ext-image-copy-capture + DMA-BUF, so they
# render blank while an output is asleep (goodnight / DPMS off) - that's expected.
#
# Built from the `hyprshell` dev branch (v4.11.0-alpha.1) at ~/src/hyprshell:
# the AUR's 4.10.8 release is icons-only, live thumbnails landed 2026-06-25.
#
# Runs under ~/dotfiles/bin/hyprshell-run (supervisor), NOT bare: when the
# daemon dies, its IPC-registered Shift/Alt/Tab binds go stale and every Shift
# press spawns a spinning `hyprshell socat` client - crash/restart cycles once
# stacked ~4,300 duplicate binds (the "shift stutter + fans" incident). The
# wrapper logs daemon output, wipes stale binds before every (re)start,
# restarts on crash, and stops loudly on a crash loop.
exec-once = ~/dotfiles/bin/hyprshell-run

# Goodnight self-heal: night mode's RGB/DPMS restore only runs from a watcher
# waiting for hyprlock to exit. A reboot/crash while in night mode kills that
# watcher, leaving lights off + mouse-wake disabled with a stale state file.
# On boot, if we're still flagged "night", run the day restore to reconcile.
exec-once = bash -c 'test -f ~/.local/state/goodnight.active && ~/.local/bin/goodnight day'
