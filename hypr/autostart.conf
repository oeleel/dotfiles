# Extra autostart processes
# exec-once = uwsm-app -- my-service
exec-once = omarchy-lock-screen

# Re-apply Breeze cursor on every Hyprland start (setcursor is runtime-only)
exec-once = hyprctl setcursor breeze_cursors 24

# Pyprland daemon: powers the dropdown scratchpad (see ~/.config/pypr/config.toml)
exec-once = pypr

# Keep the Wispr Flow flow bar pinned to bottom-center (see script header).
exec-once = ~/.config/hypr/wispr-flow-position.sh
