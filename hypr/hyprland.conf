# Learn how to configure Hyprland: https://wiki.hypr.land/Configuring/

# Use defaults Omarchy defaults (but don't edit these directly!)
source = ~/.local/share/omarchy/default/hypr/autostart.conf
source = ~/.local/share/omarchy/default/hypr/bindings/media.conf
source = ~/.local/share/omarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/omarchy/default/hypr/bindings/tiling-v2.conf
source = ~/.local/share/omarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/omarchy/default/hypr/envs.conf
source = ~/.local/share/omarchy/default/hypr/looknfeel.conf
source = ~/.local/share/omarchy/default/hypr/input.conf
source = ~/.local/share/omarchy/default/hypr/windows.conf
source = ~/.config/omarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Toggle config flags dynamically
source = ~/.local/state/omarchy/toggles/hypr/*.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

# Breeze cursor theme (from the breeze-cursors package)
env = XCURSOR_THEME,breeze_cursors

# Frost the floating Waybar island (ignore_alpha keeps blur inside the rounded pill)
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.3, match:namespace waybar

# Same glass treatment for mako notifications
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.3, match:namespace notifications

# App homes: apps always open on their own workspace
windowrule = workspace 1, match:class ^(chromium|Chromium)$
windowrule = workspace 4, match:class ^signal$
windowrule = workspace 4, match:class ^chrome-discord\.com.*$
windowrule = workspace 5, match:class ^(spotify|Spotify)$

# Dropdown scratchpad terminal (SUPER+S) is now managed by pyprland (see ~/.config/pypr/config.toml).
# pyprland handles float/size/position/animation, so no windowrules are needed here.
# (Opacity for dropdown-terminal is still set in looknfeel.conf.)

# Wispr Flow "flow bar" overlay (class wispr-flow, title "Status").
# The window is already floating, but omarchy's default decorations/opacity
# dress it up like a normal window, making the small overlay look like a big
# boxy "terminal window". Strip all the chrome so only the bar itself shows.
# (The main app window keeps title "Hub" and is intentionally left untouched.)
windowrule = float on,             match:class ^wispr-flow$, match:title ^Status$
# NOTE: position is handled by ~/.config/hypr/wispr-flow-position.sh (autostart),
# not a `move` rule. The window maps before its title is set to "Status", so a
# static move rule never matches; the script listens for events and repositions.
windowrule = border_size 0,        match:class ^wispr-flow$, match:title ^Status$
windowrule = rounding 0,           match:class ^wispr-flow$, match:title ^Status$
windowrule = no_shadow on,         match:class ^wispr-flow$, match:title ^Status$
windowrule = no_blur on,           match:class ^wispr-flow$, match:title ^Status$
windowrule = opacity 1.0 override, match:class ^wispr-flow$, match:title ^Status$
# Keep focus on the app you're dictating into (so text injection targets it).
windowrule = no_focus on,          match:class ^wispr-flow$, match:title ^Status$

# Park the main Hub window on a hidden special workspace so Wispr runs in the
# background without a window in the way (this build has no tray icon). Dictation
# is global (helper + hotkey), so it works fully while Hub is hidden. Toggle Hub
# into view with SUPER+U (see bindings.conf).
windowrule = workspace special:wispr silent, match:class ^wispr-flow$, match:title ^Hub$
